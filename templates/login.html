{% extends "base.html" %}
{% block title %}Login · LinkVault{% endblock %}
{% block content %}
  <h1>LinkVault</h1><p class="subtext">Your links, in one place.</p>
  <form method="post" class="stacked">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" required minlength="3" maxlength="40" autocomplete="username"></label>
    <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
    <button>Log in</button>
  </form>
  <p class="center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
