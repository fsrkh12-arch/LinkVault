{% extends "base.html" %}
{% block title %}Login · LinkVault{% endblock %}
{% block content %}
  <div class="auth-brand"><span>🔗</span><div><h1>LinkVault</h1><p class="subtext">Your corner of the internet.</p></div></div>
  <div class="auth-copy"><strong>Save it. Find it. Use it.</strong><p>Keep the good stuff close and the tabs under control.</p></div>
  <form method="post" class="stacked">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" required minlength="3" maxlength="40" autocomplete="username"></label>
    <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
    <button>Log in →</button>
  </form>
  <p class="center">New to LinkVault? <a href="{{ url_for('register') }}">Create your space ✨</a></p>
{% endblock %}
